<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CASE 112405</title>
<script>
(function(){
  var path = location.pathname;
  var repo = path.split('/').filter(Boolean)[0];
  var base = location.hostname.endsWith('github.io') && repo ? '/' + repo : '';
  var target = base + '/?route=' + encodeURIComponent(path.slice(base.length) + location.search + location.hash);
  location.replace(target);
})();
</script>
</head>
<body></body>
</html>
